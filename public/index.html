<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSB Noticeboard</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-900"><header class="bg-slate-950 text-white"><div class="max-w-6xl mx-auto p-5 flex justify-between"><div><h1 class="text-2xl font-bold">V.S.B Noticeboard</h1><p class="text-slate-400 text-sm">Information Technology Department</p></div><button id="admin" class="bg-blue-600 px-4 py-2 rounded-lg">Admin</button></div></header><main class="max-w-6xl mx-auto p-5"><div class="bg-white rounded-2xl p-4 shadow-sm mb-5 flex flex-wrap gap-3"><select id="class" class="border rounded-lg p-3"><option>IT-A</option><option>IT-B</option><option>IT-C</option></select><select id="cat" class="border rounded-lg p-3"><option value="">All categories</option><option>General</option><option>Academic</option><option>Exam</option><option>Event</option><option>Placement</option><option>Achievement</option></select><input id="search" class="border rounded-lg p-3 flex-1" placeholder="Search notices..."></div><div id="notices" class="space-y-4"></div></main><div id="login" class="hidden fixed inset-0 bg-black/60 items-center justify-center p-4"><form id="form" class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-3"><h2 class="text-xl font-bold">Admin Login</h2><input id="email" type="email" required class="w-full border p-3 rounded-lg" placeholder="Email"><input id="pass" type="password" required class="w-full border p-3 rounded-lg" placeholder="Password"><button class="w-full bg-blue-600 text-white p-3 rounded-lg">Sign in</button><p id="err" class="text-red-600 text-sm"></p></form></div><div id="panel" class="hidden fixed inset-0 bg-slate-950/70 p-4 overflow-auto"><div class="bg-white max-w-3xl mx-auto rounded-2xl p-6"><div class="flex justify-between"><h2 class="text-2xl font-bold">Admin Dashboard</h2><button onclick="panel.classList.add('hidden')">✕</button></div><div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-2 my-5"></div><form id="noticeForm" class="space-y-3"><input id="title" required class="w-full border p-3 rounded-lg" placeholder="Notice title"><textarea id="content" required class="w-full border p-3 rounded-lg" placeholder="Content"></textarea><div class="grid md:grid-cols-3 gap-2"><select id="priority" class="border p-3 rounded-lg"><option>medium</option><option>high</option><option>low</option></select><select id="ncat" class="border p-3 rounded-lg"><option>General</option><option>Academic</option><option>Exam</option><option>Event</option><option>Placement</option><option>Achievement</option></select><select id="nclass" class="border p-3 rounded-lg"><option>IT-A</option><option>IT-B</option><option>IT-C</option></select></div><input id="expiry" type="datetime-local" class="w-full border p-3 rounded-lg"><button class="w-full bg-blue-600 text-white p-3 rounded-lg">Publish Notice</button></form><div id="manage" class="mt-6 space-y-2"></div></div></div><script>
let token=localStorage.getItem('vsb_token')||'';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const q=new URLSearchParams({class_code:$('class').value});if($('cat').value)q.set('category',$('cat').value);if($('search').value)q.set('search',$('search').value);const n=await api('/api/notices?'+q);$('notices').innerHTML=n.length?n.map(x=>'<article class="bg-white rounded-2xl p-5 shadow-sm border-l-4 '+(x.priority==='high'?'border-red-500':x.priority==='medium'?'border-amber-500':'border-blue-500')+'"><div class="text-xs text-blue-600 font-bold uppercase">'+esc(x.category)+'</div><h2 class="text-xl font-bold mt-1">'+esc(x.title)+'</h2><p class="text-slate-600 mt-2 whitespace-pre-wrap">'+esc(x.content)+'</p><div class="text-xs text-slate-400 mt-4">'+(x.class_code||'All classes')+' · '+new Date(x.created_at).toLocaleString()+'</div></article>').join(''):'<div class="text-center p-10 text-slate-500">No active notices found.</div>'}
async function openAdmin(){if(!token){login.classList.remove('hidden');login.classList.add('flex');return}try{const s=await api('/api/admin/stats');stats.innerHTML=Object.entries(s).map(([k,v])=>'<div class="bg-slate-50 rounded-lg p-3"><small>'+k+'</small><div class="font-bold text-xl">'+v+'</div></div>').join('');const n=await api('/api/notices');manage.innerHTML=n.map(x=>'<div class="border rounded-lg p-3 flex justify-between"><span>'+esc(x.title)+'</span><button class="text-red-600" onclick="delNotice(\''+x.id+'\')">Delete</button></div>').join('');panel.classList.remove('hidden')}catch{token='';localStorage.removeItem('vsb_token');openAdmin()}}
admin.onclick=openAdmin;
form.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});token=d.token;localStorage.setItem('vsb_token',token);login.classList.add('hidden');openAdmin()}catch(e){err.textContent=e.message}};
noticeForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/notices',{method:'POST',body:JSON.stringify({title:title.value,content:content.value,priority:priority.value,category:ncat.value,class_code:nclass.value,expires_at:expiry.value?new Date(expiry.value).toISOString():null})});e.target.reset();await load();openAdmin()}catch(e){alert(e.message)}};
async function delNotice(id){if(confirm('Delete this notice?')){await api('/api/notices/'+id,{method:'DELETE'});await load();openAdmin()}}
class.onchange=load;cat.onchange=load;search.oninput=()=>{clearTimeout(window.t);window.t=setTimeout(load,300)};load();
</script></body></html>
