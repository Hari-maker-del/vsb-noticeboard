name: Node.js CI
on:
  push:
    branches: ["main","production-upgrade"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: node --check server.js
      - run: node --check database.js
      - run: node --check public/app.js
      - run: npm test