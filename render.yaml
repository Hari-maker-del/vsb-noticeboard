services:
  - type: web
    name: vsb-noticeboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vsb-noticeboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_S3_PREFIX
        value: vsb-noticeboard/backups
databases:
  - name: vsb-noticeboard-db
    plan: basic-256mb

  - type: cron
    name: vsb-noticeboard-health-monitor
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node scripts/health-check.js
    schedule: "*/15 * * * *"
    envVars:
      - key: SERVICE_URL
        value: https://vsb-noticeboard.onrender.com
      - key: HEALTHCHECK_PATH
        value: /api/health
      - key: HEALTHCHECK_TIMEOUT_MS
        value: "10000"
      - key: REQUIRE_DURABLE_PERSISTENCE
        value: "false"
